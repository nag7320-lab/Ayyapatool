# =============================================================================
# Aypa TaxAI - Manual Deployment Workflow
# Manually triggered deployment to staging or production
# Pushes Docker images to ECR and deploys to ECS Fargate
# =============================================================================

name: Deploy to Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Docker image tag to deploy (defaults to latest commit SHA)"
        required: false
        type: string
        default: ""
      skip_build:
        description: "Skip Docker build and deploy existing images"
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: ap-south-1
  PROJECT_NAME: aypa-taxai
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # Validate - Pre-deployment checks
  # ---------------------------------------------------------------------------
  validate:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      cluster_name: ${{ steps.set-env.outputs.cluster_name }}
      backend_service: ${{ steps.set-env.outputs.backend_service }}
      frontend_service: ${{ steps.set-env.outputs.frontend_service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Production deployment guard
        if: inputs.environment == 'production'
        run: |
          echo "::warning::Production deployment initiated by ${{ github.actor }}"
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

      - name: Set image tag
        id: set-tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set environment-specific variables
        id: set-env
        run: |
          ENV="${{ inputs.environment }}"
          echo "cluster_name=${PROJECT_NAME}-${ENV}-cluster" >> $GITHUB_OUTPUT
          echo "backend_service=${PROJECT_NAME}-${ENV}-backend" >> $GITHUB_OUTPUT
          echo "frontend_service=${PROJECT_NAME}-${ENV}-frontend" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Build and Push Docker Images
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.skip_build != true
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'production' && secrets.AWS_ROLE_ARN_PRODUCTION || secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers (backend)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-backend
          key: ${{ runner.os }}-buildx-backend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-backend-

      - name: Cache Docker layers (frontend)
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-frontend-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infrastructure/docker/Dockerfile.backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ needs.validate.outputs.image_tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ inputs.environment }}
          cache-from: type=local,src=/tmp/.buildx-cache-backend
          cache-to: type=local,dest=/tmp/.buildx-cache-backend-new,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infrastructure/docker/Dockerfile.frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ needs.validate.outputs.image_tag }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ inputs.environment }}
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Move caches
        run: |
          rm -rf /tmp/.buildx-cache-backend /tmp/.buildx-cache-frontend
          mv /tmp/.buildx-cache-backend-new /tmp/.buildx-cache-backend
          mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend

      - name: Scan backend image for vulnerabilities
        if: inputs.environment == 'production'
        run: |
          aws ecr wait image-scan-complete \
            --repository-name ${{ env.PROJECT_NAME }}-backend \
            --image-id imageTag=${{ needs.validate.outputs.image_tag }} \
            --region ${{ env.AWS_REGION }} || true

          SCAN_RESULTS=$(aws ecr describe-image-scan-findings \
            --repository-name ${{ env.PROJECT_NAME }}-backend \
            --image-id imageTag=${{ needs.validate.outputs.image_tag }} \
            --region ${{ env.AWS_REGION }} \
            --query 'imageScanFindings.findingSeverityCounts' \
            --output json 2>/dev/null || echo '{}')

          echo "Backend scan results: $SCAN_RESULTS"
          echo "## Backend Image Scan" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$SCAN_RESULTS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Deploy to ECS Fargate
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [validate, build-and-push]
    if: always() && needs.validate.result == 'success' && (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    environment: ${{ inputs.environment }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.environment == 'production' && secrets.AWS_ROLE_ARN_PRODUCTION || secrets.AWS_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update backend ECS task definition
        id: update-backend-task
        run: |
          CLUSTER="${{ needs.validate.outputs.cluster_name }}"
          SERVICE="${{ needs.validate.outputs.backend_service }}"
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ needs.validate.outputs.image_tag }}"

          # Get current task definition
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text \
            --region ${{ env.AWS_REGION }})

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --region ${{ env.AWS_REGION }})

          # Update image in task definition
          NEW_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          # Register new task definition
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "task_arn=$NEW_TASK_ARN" >> $GITHUB_OUTPUT
          echo "Backend task definition updated: $NEW_TASK_ARN"

      - name: Update frontend ECS task definition
        id: update-frontend-task
        run: |
          CLUSTER="${{ needs.validate.outputs.cluster_name }}"
          SERVICE="${{ needs.validate.outputs.frontend_service }}"
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.PROJECT_NAME }}-frontend:${{ needs.validate.outputs.image_tag }}"

          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text \
            --region ${{ env.AWS_REGION }})

          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --region ${{ env.AWS_REGION }})

          NEW_TASK_DEF=$(echo "$TASK_DEF" | \
            jq --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)')

          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "task_arn=$NEW_TASK_ARN" >> $GITHUB_OUTPUT
          echo "Frontend task definition updated: $NEW_TASK_ARN"

      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster ${{ needs.validate.outputs.cluster_name }} \
            --service ${{ needs.validate.outputs.backend_service }} \
            --task-definition ${{ steps.update-backend-task.outputs.task_arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster ${{ needs.validate.outputs.cluster_name }} \
            --service ${{ needs.validate.outputs.frontend_service }} \
            --task-definition ${{ steps.update-frontend-task.outputs.task_arn }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for backend service stability
        run: |
          echo "Waiting for backend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ needs.validate.outputs.cluster_name }} \
            --services ${{ needs.validate.outputs.backend_service }} \
            --region ${{ env.AWS_REGION }}
          echo "Backend service is stable."
        timeout-minutes: 15

      - name: Wait for frontend service stability
        run: |
          echo "Waiting for frontend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ needs.validate.outputs.cluster_name }} \
            --services ${{ needs.validate.outputs.frontend_service }} \
            --region ${{ env.AWS_REGION }}
          echo "Frontend service is stable."
        timeout-minutes: 15

      - name: Verify deployment health
        run: |
          # Get ALB DNS name
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})

          echo "ALB DNS: $ALB_DNS"

          # Health check with retries
          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_DNS/api/health" || echo "000")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_CODE)"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES returned HTTP $HTTP_CODE. Retrying in 15s..."
            sleep 15
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Health check failed after $MAX_RETRIES attempts"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.PROJECT_NAME }}-${{ inputs.environment }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "N/A")

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Tag** | \`${{ needs.validate.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cluster** | \`${{ needs.validate.outputs.cluster_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Service** | \`${{ needs.validate.outputs.backend_service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Service** | \`${{ needs.validate.outputs.frontend_service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **ALB DNS** | \`$ALB_DNS\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Region** | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deployed by** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Timestamp** | \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Rollback Notification (on failure)
  # ---------------------------------------------------------------------------
  rollback-notification:
    name: Rollback Notification
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: failure() && needs.deploy.result == 'failure'

    steps:
      - name: Notify deployment failure
        run: |
          echo "::error::Deployment to ${{ inputs.environment }} failed!"
          echo "## DEPLOYMENT FAILED" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment to **${{ inputs.environment }}** has failed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommended Actions:" >> $GITHUB_STEP_SUMMARY
          echo "1. Check the ECS service events for errors" >> $GITHUB_STEP_SUMMARY
          echo "2. Review CloudWatch logs for the failed containers" >> $GITHUB_STEP_SUMMARY
          echo "3. ECS deployment circuit breaker may have automatically rolled back" >> $GITHUB_STEP_SUMMARY
          echo "4. If not rolled back, manually deploy the previous known-good image" >> $GITHUB_STEP_SUMMARY
